<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Loba</title>
    
    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@500..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFF9F7',
                        parchment: '#FFFDFB',
                        blush: {
                            50: '#FFF1F3',
                            100: '#FFE4E8',
                            200: '#FECDD6',
                            300: '#FDA4B4',
                            400: '#FB718B',
                        },
                        rosegold: {
                            light: '#F3D5CE',
                            DEFAULT: '#D49A89',
                            dark: '#B57766',
                        },
                        crimson: {
                            DEFAULT: '#9E1B32',
                            deep: '#761123',
                        },
                        charcoal: '#2D2426'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        script: ['"Dancing Script"', 'cursive'],
                    },
                    animation: {
                        'pulse-seal': 'pulseSeal 2.8s ease-in-out infinite',
                        'shake': 'shake 0.45s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-up': 'fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards',
                    },
                    keyframes: {
                        pulseSeal: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.06)' },
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-2px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(4px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-6px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(6px, 0, 0)' }
                        },
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(28px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFF9F7;
            color: #2D2426;
            overflow-x: hidden;
        }

        /* Soft Silk / Paper Ambient Background */
        .bg-romantic-silk {
            background-image: 
                radial-gradient(circle at 18% 20%, rgba(254, 205, 214, 0.45) 0%, transparent 48%),
                radial-gradient(circle at 82% 25%, rgba(212, 154, 137, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(255, 228, 232, 0.55) 0%, transparent 55%);
        }

        /* Subtle Linen/Paper Grain Overlay */
        .paper-texture {
            background-image: radial-gradient(rgba(181, 119, 102, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Floating Particles Canvas */
        #petals-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 3D Envelope Mechanics */
        .envelope-stage {
            perspective: 1400px;
        }

        .envelope-flap {
            transform-origin: top center;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s linear 0.35s;
            backface-visibility: visible;
        }

        .is-unsealing .envelope-flap {
            transform: rotateX(180deg);
            z-index: 5;
        }

        .wax-seal-btn {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.45s ease;
        }

        .is-unsealing .wax-seal-btn {
            transform: translate(-50%, -50%) scale(1.35) rotate(12deg);
            opacity: 0;
        }

        .letter-peek {
            transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s;
        }

        .is-unsealing .letter-peek {
            transform: translateY(-95px);
        }

        /* Stationery Card Styling */
        .stationery-card {
            background: linear-gradient(180deg, #FFFDFB 0%, #FFF9F6 100%);
            border: 1px solid rgba(212, 154, 137, 0.35);
            box-shadow: 
                0 20px 50px -12px rgba(158, 27, 50, 0.10),
                0 4px 16px -4px rgba(45, 36, 38, 0.04);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 154, 137, 0.32);
        }
    </style>
</head>
<body class="font-sans antialiased bg-romantic-silk paper-texture min-h-screen relative selection:bg-blush-200 selection:text-crimson">

    <!-- Ambient Floating Petals & Hearts -->
    <canvas id="petals-canvas"></canvas>

    <!-- ========================================================= -->
    <!-- STAGE 1: LOCKED FULL-SCREEN CLOSED ENVELOPE               -->
    <!-- ========================================================= -->
    <section id="lock-screen" class="relative z-20 min-h-screen flex flex-col items-center justify-center px-4 py-10 transition-all duration-700">
        
        <div class="text-center mb-8 max-w-md">
            <p class="font-script text-3xl sm:text-4xl text-rosegold-dark mb-1">A Private Letter</p>
            <h1 class="font-serif text-2xl sm:text-3xl font-semibold text-charcoal tracking-tight">
                For Biba
            </h1>
        </div>

        <!-- Tactile Closed 3D Envelope -->
        <div id="envelope-wrapper" class="envelope-stage w-full max-w-[420px] mb-8">
            <div id="envelope-box" class="relative w-full h-60 sm:h-68 rounded-2xl shadow-2xl shadow-crimson/15 bg-[#EBD0C8] border border-rosegold/40 select-none">
                
                <!-- Inner Parchment Card Peeking Out on Unlock -->
                <div class="letter-peek absolute inset-x-4 top-3 bottom-3 bg-parchment rounded-xl border border-blush-200 shadow-md z-10 flex flex-col items-center justify-center p-5 text-center">
                    <span class="font-script text-2xl text-crimson mb-1">For Biba</span>
                    <div class="w-12 h-px bg-rosegold/50 my-1.5"></div>
                    <p class="font-serif italic text-sm text-charcoal/70">Unsealing your message...</p>
                </div>

                <!-- Envelope Front Pocket Folds (Left, Right, Bottom) -->
                <svg class="absolute inset-0 w-full h-full z-20 pointer-events-none rounded-2xl overflow-hidden" viewBox="0 0 420 260" preserveAspectRatio="none">
                    <!-- Subtle Inner Shadow Lines -->
                    <polygon points="0,0 214,142 0,260" fill="#F5E1DA" />
                    <polygon points="420,0 206,142 420,260" fill="#F0D8D0" />
                    <polygon points="0,260 210,126 420,260" fill="#F9EBE6" />
                </svg>

                <!-- Top Triangular Envelope Flap -->
                <div class="envelope-flap absolute top-0 left-0 right-0 h-[54%] z-30 pointer-events-none">
                    <svg class="w-full h-full drop-shadow-md" viewBox="0 0 420 140" preserveAspectRatio="none">
                        <polygon points="0,0 420,0 210,140" fill="#E8C5BA" />
                    </svg>
                </div>

                <!-- Embossed Crimson Wax Seal -->
                <div class="wax-seal-btn absolute left-1/2 top-[52%] -translate-x-1/2 -translate-y-1/2 z-40 pointer-events-none">
                    <div class="w-16 h-16 sm:w-[72px] sm:h-[72px] rounded-full bg-gradient-to-br from-crimson via-crimson to-crimson-deep border-[3px] border-[#B82841] shadow-xl shadow-crimson-deep/35 flex items-center justify-center animate-pulse-seal">
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border border-blush-200/30 flex items-center justify-center">
                            <i data-lucide="heart" class="w-6 h-6 sm:w-7 sm:h-7 text-blush-100 fill-blush-100"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Secret Password Prompt -->
        <form id="unlock-form" onsubmit="handleUnlock(event)" class="w-full max-w-sm">
            <div id="password-card" class="glass-pill rounded-3xl p-5 sm:p-6 shadow-xl shadow-crimson/5 text-center">
                <label for="secret-password" class="block text-xs uppercase tracking-[0.2em] text-rosegold-dark font-semibold mb-3">
                    Enter Secret Word to Unseal
                </label>

                <div class="flex items-center gap-2">
                    <div class="relative flex-1">
                        <input type="password" id="secret-password" autocomplete="off" placeholder="Secret password..."
                            class="w-full pl-4 pr-10 py-3 rounded-2xl bg-white/95 border border-rosegold/45 text-charcoal placeholder:text-charcoal/40 text-sm focus:outline-none focus:border-crimson focus:ring-2 focus:ring-blush-200 transition-all">
                        <button type="button" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-charcoal/40 hover:text-crimson transition-colors cursor-pointer">
                            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <button type="submit"
                        class="inline-flex items-center justify-center gap-1.5 bg-gradient-to-r from-crimson to-crimson-deep hover:opacity-95 text-white text-sm font-medium px-5 py-3 rounded-2xl shadow-md shadow-crimson/20 transition-all active:scale-95 cursor-pointer shrink-0">
                        <span>Unseal</span>
                        <i data-lucide="key-round" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Wrong Password Hint -->
                <p id="password-hint" class="min-h-[20px] text-xs font-medium text-crimson mt-2.5 opacity-0 transition-opacity duration-300">
                    Not quite... try again, my love
                </p>
            </div>
        </form>
    </section>

    <!-- ========================================================= -->
    <!-- STAGE 2: UNLOCKED VIEW (ONLY TIMER & LOVE MESSAGE)        -->
    <!-- ========================================================= -->
    <main id="unlocked-view" class="hidden relative z-10 min-h-screen flex flex-col items-center justify-center max-w-3xl mx-auto px-4 sm:px-6 py-12 sm:py-16">
        
        <!-- Header -->
        <header class="text-center mb-10 animate-fade-up">
            <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-blush-100/80 border border-blush-200 text-crimson text-[11px] font-semibold uppercase tracking-[0.2em] mb-4">
                <i data-lucide="sparkles" class="w-3 h-3 text-rosegold-dark"></i>
                <span>Happy Anniversary</span>
                <i data-lucide="sparkles" class="w-3 h-3 text-rosegold-dark"></i>
            </div>
            <h1 id="display-names" class="font-serif text-4xl sm:text-5xl md:text-6xl font-bold text-charcoal tracking-tight">
                Happy Anniversary, Biba
            </h1>
        </header>

        <!-- SECTION 1: LIVE ANNIVERSARY TIMER ("TIME TOGETHER") -->
        <section aria-label="Time Together Counter" class="w-full glass-pill rounded-3xl p-6 sm:p-8 mb-8 sm:mb-10 shadow-xl shadow-crimson/5 animate-fade-up" style="animation-delay: 0.12s;">
            <p class="text-center text-[11px] uppercase tracking-[0.25em] text-rosegold-dark font-semibold mb-5">
                Time Together
            </p>

            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2.5 sm:gap-3.5">
                <!-- Years -->
                <div class="bg-white/95 rounded-2xl p-3.5 sm:p-4 border border-blush-100 text-center shadow-sm">
                    <span id="timer-years" class="block font-serif text-2xl sm:text-4xl font-bold text-crimson tabular-nums">0</span>
                    <span class="block text-[10px] sm:text-[11px] uppercase tracking-widest text-charcoal/60 mt-1">Years</span>
                </div>
                <!-- Months -->
                <div class="bg-white/95 rounded-2xl p-3.5 sm:p-4 border border-blush-100 text-center shadow-sm">
                    <span id="timer-months" class="block font-serif text-2xl sm:text-4xl font-bold text-crimson tabular-nums">0</span>
                    <span class="block text-[10px] sm:text-[11px] uppercase tracking-widest text-charcoal/60 mt-1">Months</span>
                </div>
                <!-- Days -->
                <div class="bg-white/95 rounded-2xl p-3.5 sm:p-4 border border-blush-100 text-center shadow-sm">
                    <span id="timer-days" class="block font-serif text-2xl sm:text-4xl font-bold text-crimson tabular-nums">0</span>
                    <span class="block text-[10px] sm:text-[11px] uppercase tracking-widest text-charcoal/60 mt-1">Days</span>
                </div>
                <!-- Hours -->
                <div class="bg-white/95 rounded-2xl p-3.5 sm:p-4 border border-blush-100 text-center shadow-sm">
                    <span id="timer-hours" class="block font-serif text-2xl sm:text-4xl font-bold text-charcoal tabular-nums">00</span>
                    <span class="block text-[10px] sm:text-[11px] uppercase tracking-widest text-charcoal/60 mt-1">Hours</span>
                </div>
                <!-- Minutes -->
                <div class="bg-white/95 rounded-2xl p-3.5 sm:p-4 border border-blush-100 text-center shadow-sm">
                    <span id="timer-minutes" class="block font-serif text-2xl sm:text-4xl font-bold text-charcoal tabular-nums">00</span>
                    <span class="block text-[10px] sm:text-[11px] uppercase tracking-widest text-charcoal/60 mt-1">Mins</span>
                </div>
                <!-- Seconds -->
                <div class="bg-white/95 rounded-2xl p-3.5 sm:p-4 border border-blush-100 text-center shadow-sm">
                    <span id="timer-seconds" class="block font-serif text-2xl sm:text-4xl font-bold text-rosegold-dark tabular-nums">00</span>
                    <span class="block text-[10px] sm:text-[11px] uppercase tracking-widest text-charcoal/60 mt-1">Secs</span>
                </div>
            </div>

            <p class="text-center text-xs sm:text-sm text-rosegold-dark font-medium mt-5">
                Since <span id="display-since-date" class="underline decoration-rosegold/50 underline-offset-4">November 17, 2025</span>
            </p>
        </section>

        <!-- SECTION 2: THE LOVE MESSAGE (STATIONERY LETTER CARD) -->
        <article aria-label="Love Letter" class="w-full stationery-card rounded-[2rem] p-7 sm:p-12 relative overflow-hidden animate-fade-up" style="animation-delay: 0.24s;">
            <!-- Subtle Decorative Wax Stamp Emblem at Top -->
            <div class="flex items-center justify-between border-b border-blush-200/70 pb-5 mb-7">
                <h2 id="display-salutation" class="font-script text-3xl sm:text-4xl text-crimson">
                    My Dearest Biba,
                </h2>
                <div class="w-10 h-10 rounded-full bg-blush-50 border border-rosegold/40 flex items-center justify-center text-crimson shrink-0">
                    <i data-lucide="heart" class="w-4 h-4 fill-crimson"></i>
                </div>
            </div>

            <!-- Letter Body -->
            <div id="display-message" class="font-serif text-lg sm:text-xl text-charcoal/90 leading-[1.85] whitespace-pre-line"></div>

            <!-- Signature Block -->
            <div class="mt-9 pt-6 border-t border-blush-200/70 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-rosegold-dark mb-1">Forever yours,</p>
                    <p id="display-signature" class="font-script text-3xl sm:text-4xl text-crimson">
                        Khalid
                    </p>
                </div>
            </div>
        </article>
    </main>

    <!-- ========================================================= -->
    <!-- SCRIPT & HARDCODED CONFIGURATION                          -->
    <!-- ========================================================= -->
    <script>
        /**
         * =====================================================================
         * CONFIGURATION
         * =====================================================================
         */
        const PASSWORD = "dody"; // Case-insensitive secret password to unseal the envelope
        const ANNIVERSARY_DATE = "2025-11-17T00:00:00"; // November 17, 2025
        const PARTNER_NAMES = "Happy Anniversary, Biba";
        const LETTER_SALUTATION = "My Dearest Biba,";
        const LETTER_SIGNATURE = "Khalid";
        const LOVE_MESSAGE = `ana bahebek awy awy awy ya biba walahi bamoot feeky we ma2darsh a3eesh men gherek ya roohy we ya rab nefdal dayman ma3 ba3d we inshallah rabena yekteblena aly feeh al kheir ya habibty kanet ahsan sana fe hayaty we inshallah aly gayy ahsan we ahsan rabena yekhaleeky leya ya habibty we mayeb3edneesh 3anek abadan ya rooh alby ya biba bahebek we bamoot feeky ya rooh alby men gowa`;

        /**
         * =====================================================================
         * APPLICATION LOGIC
         * =====================================================================
         */
        let timerInterval = null;

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const input = document.getElementById("secret-password");
            const icon = document.getElementById("eye-icon");
            if (input.type === "password") {
                input.type = "text";
                icon.setAttribute("data-lucide", "eye-off");
            } else {
                input.type = "password";
                icon.setAttribute("data-lucide", "eye");
            }
            if (window.lucide) lucide.createIcons();
        }

        // Handle Password Submission & Envelope Unsealing
        function handleUnlock(e) {
            e.preventDefault();
            const input = document.getElementById("secret-password");
            const hint = document.getElementById("password-hint");
            const passwordCard = document.getElementById("password-card");
            const envelopeBox = document.getElementById("envelope-box");

            const entered = input.value.trim().toLowerCase();

            if (entered === PASSWORD.trim().toLowerCase()) {
                // Correct password!
                hint.classList.add("opacity-0");
                input.blur();

                // 1. Trigger 3D wax seal break & flap opening animation
                envelopeBox.classList.add("is-unsealing");
                burstHearts(28);

                // 2. Smoothly fade out lock screen and reveal Timer + Love Message
                setTimeout(() => {
                    const lockScreen = document.getElementById("lock-screen");
                    const unlockedView = document.getElementById("unlocked-view");

                    lockScreen.style.opacity = "0";
                    lockScreen.style.transform = "scale(0.97)";

                    setTimeout(() => {
                        lockScreen.classList.add("hidden");
                        unlockedView.classList.remove("hidden");
                        renderUnlockedContent();
                        startTimer();
                        burstHearts(18);
                        if (window.lucide) lucide.createIcons();
                    }, 550);
                }, 1150);
            } else {
                // Wrong password: shake animation + gentle romantic hint
                passwordCard.classList.remove("animate-shake");
                envelopeBox.classList.remove("animate-shake");
                void passwordCard.offsetWidth; // trigger reflow
                passwordCard.classList.add("animate-shake");
                envelopeBox.classList.add("animate-shake");

                hint.classList.remove("opacity-0");
                input.select();
            }
        }

        // Render Unlocked Timer Header & Love Letter
        function renderUnlockedContent() {
            document.getElementById("display-names").textContent = PARTNER_NAMES;
            document.getElementById("display-salutation").textContent = LETTER_SALUTATION;
            document.getElementById("display-signature").textContent = LETTER_SIGNATURE;
            document.getElementById("display-message").textContent = LOVE_MESSAGE;

            const startObj = new Date(ANNIVERSARY_DATE);
            if (!isNaN(startObj.getTime())) {
                document.getElementById("display-since-date").textContent = startObj.toLocaleDateString("en-US", {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                });
            }
            updateTimer();
        }

        // Accurate Calendar-Aware Elapsed Time Calculation (Years, Months, Days, Hours, Mins, Secs)
        function updateTimer() {
            const start = new Date(ANNIVERSARY_DATE);
            const now = new Date();

            if (isNaN(start.getTime()) || now < start) {
                ["timer-years", "timer-months", "timer-days"].forEach(id => document.getElementById(id).textContent = "0");
                ["timer-hours", "timer-minutes", "timer-seconds"].forEach(id => document.getElementById(id).textContent = "00");
                return;
            }

            let years = now.getFullYear() - start.getFullYear();
            let months = now.getMonth() - start.getMonth();
            let days = now.getDate() - start.getDate();
            let hours = now.getHours() - start.getHours();
            let minutes = now.getMinutes() - start.getMinutes();
            let seconds = now.getSeconds() - start.getSeconds();

            if (seconds < 0) {
                seconds += 60;
                minutes--;
            }
            if (minutes < 0) {
                minutes += 60;
                hours--;
            }
            if (hours < 0) {
                hours += 24;
                days--;
            }
            if (days < 0) {
                // Days in the previous month relative to 'now'
                const prevMonthDays = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
                days += prevMonthDays;
                months--;
            }
            if (months < 0) {
                months += 12;
                years--;
            }

            document.getElementById("timer-years").textContent = years;
            document.getElementById("timer-months").textContent = months;
            document.getElementById("timer-days").textContent = days;
            document.getElementById("timer-hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("timer-minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("timer-seconds").textContent = String(seconds).padStart(2, "0");
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        /**
         * =====================================================================
         * SUBTLE AMBIENT PETALS & HEART BURST CANVAS
         * =====================================================================
         */
        const canvas = document.getElementById("petals-canvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(isBurst = false) {
                this.reset(isBurst);
            }

            reset(isBurst = false) {
                this.isBurst = isBurst;
                this.x = isBurst ? window.innerWidth / 2 + (Math.random() - 0.5) * 140 : Math.random() * canvas.width;
                this.y = isBurst ? window.innerHeight * 0.45 : -20 - Math.random() * canvas.height;
                this.size = Math.random() * 7 + 5;
                this.vx = (Math.random() - 0.5) * (isBurst ? 5.5 : 0.6);
                this.vy = isBurst ? -(Math.random() * 4 + 1.5) : Math.random() * 0.7 + 0.3;
                this.gravity = isBurst ? 0.08 : 0;
                this.rot = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.025;
                this.alpha = isBurst ? 0.85 : Math.random() * 0.3 + 0.12;
                this.isHeart = isBurst ? true : Math.random() > 0.45;
                const palette = ["#FDA4B4", "#FECDD6", "#D49A89", "#FB718B", "#9E1B32"];
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }

            update() {
                this.vy += this.gravity;
                this.x += this.vx + Math.sin(this.y * 0.015) * 0.25;
                this.y += this.vy;
                this.rot += this.vRot;

                if (this.isBurst) {
                    this.alpha -= 0.011;
                } else if (this.y > canvas.height + 20) {
                    this.reset(false);
                    this.y = -20;
                }
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;

                if (this.isHeart) {
                    const s = this.size * 0.65;
                    ctx.beginPath();
                    ctx.moveTo(0, s * 0.3);
                    ctx.bezierCurveTo(0, -s * 0.3, -s, -s * 0.3, -s, s * 0.3);
                    ctx.bezierCurveTo(-s, s * 0.8, 0, s * 1.2, 0, s * 1.5);
                    ctx.bezierCurveTo(0, s * 1.2, s, s * 0.8, s, s * 0.3);
                    ctx.bezierCurveTo(s, -s * 0.3, 0, -s * 0.3, 0, s * 0.3);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.7, this.size * 0.38, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function initAmbientParticles() {
            const count = window.innerWidth < 640 ? 16 : 26;
            for (let i = 0; i < count; i++) {
                const p = new Particle(false);
                p.y = Math.random() * canvas.height;
                particles.push(p);
            }
        }

        function burstHearts(count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(true));
            }
        }

        function loopParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => !p.isBurst || p.alpha > 0);
            for (const p of particles) {
                p.update();
                p.draw();
            }
            requestAnimationFrame(loopParticles);
        }

        window.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) lucide.createIcons();
            initAmbientParticles();
            loopParticles();
        });
    </script>
</body>
</html>
